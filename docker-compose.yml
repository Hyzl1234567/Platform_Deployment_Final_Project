services:

  platform_docker-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hyzlann-final-project
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    env_file:
      - .env
    environment:
      DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@platform_docker-db:3306/${MYSQL_DATABASE}?serverVersion=8.0.32&charset=utf8mb4"
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    depends_on:
      platform_docker-db:
        condition: service_healthy
    networks:
      - platform-network

  platform_docker-nginx:
    image: nginx:alpine
    container_name: hyzlann-final-project-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx-main.conf:/etc/nginx/nginx.conf
    depends_on:
      - platform_docker-app
    networks:
      - platform-network

  platform_docker-db:
    image: mysql:8.0
    container_name: hyzlann-final-project-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - platform-db-data:/var/lib/mysql
    networks:
      - platform-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  platform_docker-phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: hyzlann-final-project-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: platform_docker-db
      PMA_USER: ${MYSQL_USER}
      PMA_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "8080:80"
    depends_on:
      - platform_docker-db
    networks:
      - platform-network

volumes:
  platform-db-data:

networks:
  platform-network: